services:
  - type: web
    name: codesync-backend
    env: node
    region: oregon
    buildCommand: npm install && npm run build -w shared && npm run build -w server
    startCommand: npm start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
